<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유튜브 분석기</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <p class="nav"><span></span><a href="/report">분석 보고서 →</a></p>
  <h1>유튜브 분석기</h1>
  <p class="sub">키워드와 최소 조회수로 영상을 찾고, 영상을 골라 왜 조회수가 많이 나왔는지 분석해요.</p>

  <form class="search" id="form">
    <div class="kw"><label for="keyword">키워드</label><input id="keyword" required placeholder="예: 캠핑 브이로그"></div>
    <div><label for="min_views">최소 조회수</label><input id="min_views" type="number" min="0" step="1000" value="100000"></div>
    <div><label for="limit">검색 개수</label>
      <select id="limit"><option>30</option><option selected>50</option><option>100</option><option>200</option></select></div>
    <button type="submit" id="searchBtn">검색</button>
  </form>

  <div class="bar">
    <span class="status" id="status">검색어를 입력해 주세요.</span>
    <button id="analyzeBtn" disabled>선택한 영상 분석</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let selected = null;

function fmtDur(s) {
  if (!s) return '';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(sec).padStart(2, '0');
}
function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  selected = null; $('analyzeBtn').disabled = true; $('grid').innerHTML = '';
  $('searchBtn').disabled = true; $('status').textContent = '검색 중...';
  const q = new URLSearchParams({ keyword: $('keyword').value, min_views: $('min_views').value || 0, limit: $('limit').value });
  try {
    const res = await fetch('/api/search?' + q);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    $('status').textContent = data.videos.length
      ? `조회수 ${Number($('min_views').value || 0).toLocaleString()} 이상 영상 ${data.videos.length}개 · 분석할 영상을 골라 주세요.`
      : '조건에 맞는 영상이 없어요. 최소 조회수를 낮추거나 검색 개수를 늘려 보세요.';
    for (const v of data.videos) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<img src="${v.thumbnail}" alt="" loading="lazy">
        <div class="body"><div class="title">${esc(v.title)}</div>
        <div class="meta"><span class="views">조회수 ${v.views.toLocaleString()}</span> · ${fmtDur(v.duration)}</div>
        <div class="meta">${esc(v.channel)}${v.analyzed ? ' · <span class="badge">분석됨</span>' : ''}</div></div>`;
      card.onclick = () => {
        document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected'); selected = v; $('analyzeBtn').disabled = false;
      };
      card.ondblclick = () => window.open('https://www.youtube.com/watch?v=' + v.id, '_blank');
      $('grid').appendChild(card);
    }
  } catch (err) {
    $('status').innerHTML = `<span class="error">${esc(err.message)}</span>`;
  } finally {
    $('searchBtn').disabled = false;
  }
});

$('analyzeBtn').onclick = () => {
  if (selected) window.open('/analyze/' + selected.id + '?title=' + encodeURIComponent(selected.title), '_blank');
};
</script>
</body>
</html>
